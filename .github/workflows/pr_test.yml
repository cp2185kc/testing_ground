name: contributor Provenance & PR Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    
jobs:
  audit_provenance:
    name: Audit contribution Provenance & Execution Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Chekout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Inspect Pull Request
        run: |
          echo "=== PULL REQUEST AUDIT ==="

          echo "--- Event Information ---"
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"

          echo "--- PR Information ---"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR State: ${{ github.event.pull_request.state }}"
          echo "PR Draft: ${{ github.event.pull_request.draft }}"

          echo "--- Contributor Information ---"
          echo "PR Author: ${{ github.event.pull_request.user.login }}"
          echo "Workflow Actor: ${{ github.actor }}"

          echo "--- Repository Information ---"
          echo "Source Repository: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "Target Repository: ${{ github.event.pull_request.base.repo.full_name }}"

          echo "--- Branch Information ---"
          echo "Source Branch: ${{ github.event.pull_request.head.ref }}"
          echo "Target Branch: ${{ github.event.pull_request.base.ref }}"

          echo "--- Commit Information ---"
          echo "Head Commit SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Workflow SHA: ${{ github.sha }}"

          echo "--- Change Statistics ---"
          echo "Commits: ${{ github.event.pull_request.commits }}"
          echo "Files Changed: ${{ github.event.pull_request.changed_files }}"
          echo "Additions: ${{ github.event.pull_request.additions }}"
          echo "Deletions: ${{ github.event.pull_request.deletions }}"

          echo "--- Timestamp Information ---"
          echo "PR Created: ${{ github.event.pull_request.created_at }}"
          echo "PR Updated: ${{ github.event.pull_request.updated_at }}"

          echo "--- Runner Environment ---"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Architecture: ${{ runner.arch }}"
          uname -a
          
      - name: Inspect Git Commit
        run: |
          echo "=== LOCAL GIT INFORMATION ==="
          git log -1 --pretty=format:"Commit: %H%nAuthor: %an <%ae>%nDate: %ad"
          echo ""

      - name: Generate Audit Artifact
        run: |
          mkdir -p audit_artifacts

          echo "=== PULL REQUEST AUDIT MANIFEST ===" > audit_artifacts/pr_audit.txt
          echo "PR Number: ${{ github.event.pull_request.number }}" >> audit_artifacts/pr_audit.txt
          echo "PR Author: ${{ github.event.pull_request.user.login }}" >> audit_artifacts/pr_audit.txt
          echo "Workflow Actor: ${{ github.actor }}" >> audit_artifacts/pr_audit.txt
          echo "Source Repository: ${{ github.event.pull_request.head.repo.full_name }}" >> audit_artifacts/pr_audit.txt
          echo "Target Repository: ${{ github.event.pull_request.base.repo.full_name }}" >> audit_artifacts/pr_audit.txt
          echo "Source Branch: ${{ github.event.pull_request.head.ref }}" >> audit_artifacts/pr_audit.txt
          echo "Target Branch: ${{ github.event.pull_request.base.ref }}" >> audit_artifacts/pr_audit.txt
          echo "Head Commit SHA: ${{ github.event.pull_request.head.sha }}" >> audit_artifacts/pr_audit.txt
          echo "Event Action: ${{ github.event.action }}" >> audit_artifacts/pr_audit.txt

          sha256sum audit_artifacts/pr_audit.txt > audit_artifacts/pr_audit.sha256

      - name: Upload Provenance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-provenance
          path: audit_artifacts/
