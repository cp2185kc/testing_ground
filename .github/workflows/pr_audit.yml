name: contributor Provenance & PR Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    
jobs:
  audit_provenance:
    name: Audit contribution Provenance & Execution Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Chekout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Extra Commit & Author Host Footprint
        run: |
          echo "=== PULL REQUEST AUDIT MANIFEST===" > pr_audit.txt
					echo "" >> pr_audit.txt

          echo "--- Event Information ---" >> pr_audit.txt
          echo "Event Name: ${{ github.event_name }}" >> pr_audit.txt
          echo "Event Action: ${{ github.event.action }}" >> pr_audit.txt
					echo "" >> pr_audit.txt

          echo "--- PR Information ---" >> pr_audit.txt
          echo "PR Number: ${{ github.event.pull_request.number }}" >> pr_audit.txt
          echo "PR Title: ${{ github.event.pull_request.title }}" >> pr_audit.txt
          echo "PR State: ${{ github.event.pull_request.state }}" >> pr_audit.txt
          echo "Contributor Login: ${{ github.event.pull_request.user.login }}" >> pr_audit.txt
          echo "Head Commit SHA: ${{ github.event.pull_request.head.sha }}" >> pr_audit.txt
					echo "" >> pr_audit.txt

          echo "--- Repository Information ---" >> pr_audit.txt
          echo "Source Repository: ${{ github.event.pull_request.head.repo.full_name }}" >> pr_audit.txt
					echo "Source Branch: ${{ github.event.pull_request.head.ref }}" >> pr_audit.txt
					echo "" >> pr_audit.txt
					
          echo "Target Repository: ${{ github.event.pull_request.base.repo.full_name }}" >> pr_audit.txt
          echo "Target Branch: ${{ github.event.pull_request.base.ref }}" >> pr_audit.txt
					echo "" >> pr_audit.txt

          echo "--- Timestamp Information ---" >> pr_audit.txt
          echo "PR Created: ${{ github.event.pull_request.created_at }}" >> pr_audit.txt
          echo "PR Updated: ${{ github.event.pull_request.updated_at }}" >> pr_audit.txt
					echo "" >> pr_audit.txt

          echo "--- Runner Node Execution Environment ---" >> pr_audit.txt
          echo "Runner OS: ${{ runner.os }}" >> pr_audit.txt
          echo "Runner Architecture: ${{ runner.arch }}" >> pr_audit.txt
          uname -a
					echo "" >> pr_audit.txt
          
          echo "=== LOCAL GIT INFORMATION ==="
          git log -1 --pretty=format:"Commit: %H%nAuthor: %an <%ae>%nDate: %ad%nPGP Key: %GK" >> pr_audit.txt
          echo "" >> pr_audit.txt

      - name: Generate Signed Audit Artifact
        run: |
          sha256sum pr_audit.txt > pr_audit.sha256
					mkdir -p ./audit_artifacts/
					mv pr_audit.txt pr_audit.sha256 ./audit_artifacts/

      - name: Upload Provenance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-provenance
          path: ./audit_artifacts/
